<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register - APEX FORCE ESPORT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="Image Folder/Club Logo/our_logo.jpg" alt="APEX FORCE ESPORT">
        APEX<span>FORCE</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html" data-page="home">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="ranking.html" data-page="rankings">Rankings</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html" data-page="events">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="players.html" data-page="players">Players</a></li>
          <li class="nav-item"><a class="nav-link" href="tickets.html" data-page="shop">Tickets</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html" data-page="about">About</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2" id="navAuth">
          <a href="login.html" class="btn-outline-custom active">Login</a>
        </div>
        <div class="d-none align-items-center gap-3" id="navUser">
          <button class="btn-outline-custom position-relative" onclick="toggleCart()">
            <i class="fas fa-shopping-cart"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
              id="cartCount">0</span>
          </button>
          <div class="dropdown">
            <img src="" id="navAvatar" class="rounded-circle"
              style="width:36px;height:36px;cursor:pointer;object-fit:cover;border:2px solid var(--primary)"
              data-bs-toggle="dropdown">
            <ul class="dropdown-menu dropdown-menu-end"
              style="background:var(--bg-card);border:1px solid var(--border)">
              <li><a class="dropdown-item" style="color:var(--text-primary)" href="profile.html"><i
                    class="fas fa-user me-2"></i>Profile</a></li>
              <li><a class="dropdown-item" style="color:var(--text-primary)" href="subscription.html"><i
                    class="fas fa-bell me-2"></i>Subscriptions</a></li>
              <li>
                <hr class="dropdown-divider" style="border-color:var(--border)">
              </li>
              <li><a class="dropdown-item" style="color:var(--danger)" href="#" onclick="logout()"><i
                    class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- TOAST -->
  <div class="toast-custom" id="toast"><span id="toastMsg"></span></div>

  <!-- AUTH -->
  <div class="auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <img src="Image Folder/Club Logo/our_logo.jpg"
          style="width:60px;height:60px;border-radius:12px;margin-bottom:12px" alt="APEX FORCE ESPORT">
        <h2 style="font-weight:800"><span style="color:var(--primary)">APEX</span>FORCE ESPORT</h2>
        <p style="color:var(--text-secondary)">Welcome back, player</p>
      </div>
      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Login</div>
        <div class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Register</div>
      </div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label">Username or Email</label>
          <input type="text" class="form-control" id="loginUser" placeholder="Enter username" required>
        </div>
        <div class="mb-3 position-relative">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPass" placeholder="Enter password" required>
          <i class="fas fa-eye password-toggle" onclick="togglePassword('loginPass',this)"></i>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" style="accent-color:var(--primary)">
            <label class="form-check-label" for="rememberMe"
              style="color:var(--text-secondary);font-size:0.85rem">Remember me</label>
          </div>
          <a href="#" style="color:var(--primary);font-size:0.85rem;text-decoration:none">Forgot password?</a>
        </div>
        <button type="submit" class="btn-primary-custom w-100 mb-3">Login</button>
        <div class="text-center" style="color:var(--text-secondary);font-size:0.8rem">
          Demo: <code style="color:var(--primary)">demo / demo123</code>
        </div>
      </form>
      <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" id="regUser" placeholder="Choose a username" required minlength="3">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="regEmail" placeholder="your@email.com" required>
        </div>
        <div class="mb-3 position-relative">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="regPass" placeholder="Min 6 characters" required
            minlength="6">
          <i class="fas fa-eye password-toggle" onclick="togglePassword('regPass',this)"></i>
        </div>
        <div class="mb-3 position-relative">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="regPass2" placeholder="Re-enter password" required>
          <i class="fas fa-eye password-toggle" onclick="togglePassword('regPass2',this)"></i>
        </div>
        <div class="mb-3">
          <label class="form-label">Steam ID</label>
          <input type="text" class="form-control" id="regSteam" placeholder="STEAM_0:X:XXXXXXX">
        </div>
        <div class="mb-3">
          <label class="form-label">I am a...</label>
          <select class="form-select" id="regRole">
            <option value="player">Player / Competitor</option>
            <option value="fan">Fan / Spectator</option>
            <option value="manager">Team Manager</option>
          </select>
        </div>
        <button type="submit" class="btn-primary-custom w-100 mb-3">Create Account</button>
      </form>
      <div class="text-center mt-3" style="color:var(--text-secondary);font-size:0.8rem">Or continue with</div>
      <div class="social-login">
        <a href="https://accounts.google.com" target="_blank" class="social-btn"><i class="fab fa-google"></i></a>
        <a href="https://discord.com/login" target="_blank" class="social-btn"><i class="fab fa-discord"></i></a>
        <a href="https://steamcommunity.com/login" target="_blank" class="social-btn"><i class="fab fa-steam"></i></a>
      </div>
    </div>
  </div>

  <!-- CART DRAWER -->
  <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h5 class="mb-0"><i class="fas fa-shopping-cart me-2" style="color:var(--primary)"></i>Your Cart</h5>
      <button class="btn-close" onclick="toggleCart()"></button>
    </div>
    <div id="cartItems"></div>
    <div class="mt-4 pt-3" style="border-top:1px solid var(--border)">
      <div class="d-flex justify-content-between mb-3">
        <span>Total:</span>
        <strong id="cartTotal" style="color:var(--primary);font-size:1.2rem">RM 0.00</strong>
      </div>
      <button class="btn-primary-custom w-100" onclick="checkout()">Checkout</button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      initApp();
    });
  </script>
</body>

</html>
